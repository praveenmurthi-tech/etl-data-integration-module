    target_table: services
    key_columns: ["service_id"]
    incremental:
      column: last_updated
      start_from: null
    mapping:
      service_id: activity_id
      customer_id: client_code
      service_date: service_week
      service_type: service_cat
      service_amount: bill_total
      service_currency: currency_symbol
      technician_name: tech_initials
