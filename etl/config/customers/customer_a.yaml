datasets:
  sales:
    source_table: sales_summary
    target_table: sales
    key_columns: ["sale_id"]
    incremental:
      column: last_modified
      start_from: null
    mapping:
      sale_id: sale_no
      customer_id: client_code
      product_id: prod_code
      sale_date: week_start
      sale_amount: total_gross
      sale_currency: curr_code
